name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          # 与本地开发快照对齐：vendored zio（vendor/zio，含 [vendor-patch]）只适配
          # 0.18.0-dev.253 时期的 std.Io（accept 改经 operate 下发）。换快照先本地
          # 验证：vendor/zio/src/io.zig 与 std.Io.VTable/Operation 是隐式契约，
          # 且 examples（runZio 配对）必须能编译。
          version: 0.18.0-dev.253+16d31ceed

      - name: Build for Ubuntu
        run: zig build

      - name: Build for Windows GNU
        run: zig build -Dtarget=x86_64-windows-gnu

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          # 同 build job：必须与 vendored zio 适配的 std.Io 快照一致，见 build job 注释。
          version: 0.18.0-dev.253+16d31ceed
      - name: Run unit & integration tests
        run: zig build test

      - name: Build examples
        working-directory: examples
        run: zig build

      - name: Run examples tests
        working-directory: examples
        run: zig build test
