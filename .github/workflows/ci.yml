name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          # 与本地开发快照对齐：vendor/zio（含适配补丁，清单见 vendor/zio/README.md）
          # 只适配 0.18.0-dev.1240 的 std.Io（Operation.Result 布局、Io.File.Uid
          # 等是隐式契约）。换快照先本地验证：vendor/zio/src/io.zig 与
          # std.Io.VTable/Operation 的匹配、examples（runZio 配对）必须能编译。
          version: 0.18.0-dev.1240+74f654a72

      - name: Build for Ubuntu
        run: zig build

      - name: Build for Windows GNU
        run: zig build -Dtarget=x86_64-windows-gnu

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          # 同 build job：必须与 vendored zio 适配的 std.Io 快照一致，见 build job 注释。
          version: 0.18.0-dev.1240+74f654a72
      - name: Run unit & integration tests
        run: zig build test

      - name: Build examples
        working-directory: examples
        run: zig build

      - name: Run examples tests
        working-directory: examples
        run: zig build test
