name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          # 必须用 0.17.0-dev.* 快照：zio 依赖（zig-0.17 分支）适配的是 dev.2294 时期的
          # std.Io.VTable（含 processReplacePath）；0.17.0 正式版已删该字段，zio 会编译失败，
          # examples（runZio 配对）连带受累。升级前先本地验证 zio+examples。
          version: 0.17.0-dev.2294+71403f299

      - name: Build for Ubuntu
        run: zig build

      - name: Build for Windows GNU
        run: zig build -Dtarget=x86_64-windows-gnu

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          # 同 build job：0.17.0 正式版与 zio 依赖不兼容，见 build job 注释。
          version: 0.17.0-dev.2294+71403f299
      - name: Run unit & integration tests
        run: zig build test

      - name: Build examples
        working-directory: examples
        run: zig build

      - name: Run examples tests
        working-directory: examples
        run: zig build test
