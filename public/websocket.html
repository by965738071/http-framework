<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WebSocket 测试工具</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
                background: #1a1a2e;
                color: #eee;
                min-height: 100vh;
                padding: 20px;
            }
            .container {
                max-width: 900px;
                margin: 0 auto;
            }
            h1 {
                text-align: center;
                color: #00d4aa;
                margin-bottom: 30px;
                font-size: 28px;
            }
            .panel {
                background: #16213e;
                border-radius: 12px;
                padding: 20px;
                margin-bottom: 20px;
                border: 1px solid #0f3460;
            }
            .panel-title {
                color: #e94560;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 15px;
                font-weight: 600;
            }
            .input-group {
                display: flex;
                gap: 10px;
                margin-bottom: 15px;
                align-items: center;
            }
            input[type="text"] {
                flex: 1;
                background: #0f3460;
                border: 1px solid #1a1a2e;
                color: #fff;
                padding: 12px 15px;
                border-radius: 8px;
                font-size: 14px;
                outline: none;
                transition: border-color 0.3s;
            }
            input[type="text"]:focus {
                border-color: #00d4aa;
            }
            input[type="text"]::placeholder {
                color: #666;
            }
            button {
                padding: 12px 24px;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .btn-connect {
                background: #00d4aa;
                color: #1a1a2e;
            }
            .btn-connect:hover {
                background: #00b894;
                transform: translateY(-1px);
            }
            .btn-disconnect {
                background: #e94560;
                color: #fff;
            }
            .btn-disconnect:hover {
                background: #c73e54;
            }
            .btn-send {
                background: #533483;
                color: #fff;
            }
            .btn-send:hover {
                background: #7b68a6;
            }
            .btn-clear {
                background: #444;
                color: #fff;
            }
            .btn-clear:hover {
                background: #555;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none !important;
            }
            .status {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 16px;
                border-radius: 20px;
                font-size: 13px;
                font-weight: 600;
                margin-left: auto;
            }
            .status-disconnected {
                background: #e9456033;
                color: #e94560;
            }
            .status-connecting {
                background: #f39c1233;
                color: #f39c12;
            }
            .status-connected {
                background: #00d4aa33;
                color: #00d4aa;
            }
            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                animation: pulse 2s infinite;
            }
            .status-disconnected .status-dot {
                background: #e94560;
            }
            .status-connecting .status-dot {
                background: #f39c12;
            }
            .status-connected .status-dot {
                background: #00d4aa;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.4;
                }
            }
            .log-container {
                background: #0a0a0a;
                border-radius: 8px;
                padding: 15px;
                height: 400px;
                overflow-y: auto;
                font-family: "Consolas", "Monaco", "Courier New", monospace;
                font-size: 13px;
                line-height: 1.6;
            }
            .log-entry {
                padding: 4px 0;
                border-bottom: 1px solid #1a1a1a;
                animation: fadeIn 0.3s ease;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateX(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }
            .log-time {
                color: #666;
                margin-right: 10px;
            }
            .log-system {
                color: #f39c12;
            }
            .log-sent {
                color: #00d4aa;
            }
            .log-received {
                color: #3498db;
            }
            .log-error {
                color: #e94560;
            }
            .log-close {
                color: #95a5a6;
            }
            .controls-row {
                display: flex;
                gap: 10px;
                margin-top: 15px;
            }
            .message-input {
                flex: 1;
            }
            .stats {
                display: flex;
                gap: 20px;
                margin-top: 15px;
                font-size: 13px;
                color: #888;
            }
            .stat-item {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .stat-value {
                color: #00d4aa;
                font-weight: 600;
            }
            /* 滚动条样式 */
            .log-container::-webkit-scrollbar {
                width: 8px;
            }
            .log-container::-webkit-scrollbar-track {
                background: #0a0a0a;
            }
            .log-container::-webkit-scrollbar-thumb {
                background: #333;
                border-radius: 4px;
            }
            .log-container::-webkit-scrollbar-thumb:hover {
                background: #444;
            }
        </style>
        <base target="_blank" />
    </head>
    <body>
        <div class="container">
            <h1>🔌 WebSocket 测试工具</h1>

            <!-- 连接面板 -->
            <div class="panel">
                <div class="panel-title">连接设置</div>
                <div class="input-group">
                    <input
                        type="text"
                        id="wsUrl"
                        placeholder="ws://127.0.0.1:9000/ws"
                        value="ws://127.0.0.1:9000/ws"
                    />
                    <button
                        class="btn-connect"
                        id="btnConnect"
                        onclick="connect()"
                    >
                        连接
                    </button>
                    <button
                        class="btn-disconnect"
                        id="btnDisconnect"
                        onclick="disconnect()"
                        disabled
                    >
                        断开
                    </button>
                    <div class="status status-disconnected" id="status">
                        <span class="status-dot"></span>
                        <span id="statusText">未连接</span>
                    </div>
                </div>
            </div>

            <!-- 消息发送面板 -->
            <div class="panel">
                <div class="panel-title">发送消息</div>
                <div class="input-group">
                    <input
                        type="text"
                        id="messageInput"
                        class="message-input"
                        placeholder="输入要发送的消息..."
                        onkeypress="handleKeyPress(event)"
                    />
                    <button
                        class="btn-send"
                        id="btnSend"
                        onclick="sendMessage()"
                        disabled
                    >
                        发送
                    </button>
                </div>
                <div class="controls-row">
                    <button class="btn-clear" onclick="clearLog()">
                        清空日志
                    </button>
                    <button class="btn-clear" onclick="sendPing()">
                        发送 Ping
                    </button>
                </div>
            </div>

            <!-- 日志面板 -->
            <div class="panel">
                <div class="panel-title">通信日志</div>
                <div class="log-container" id="log"></div>
                <div class="stats">
                    <div class="stat-item">
                        发送: <span class="stat-value" id="sentCount">0</span>
                    </div>
                    <div class="stat-item">
                        接收: <span class="stat-value" id="recvCount">0</span>
                    </div>
                    <div class="stat-item">
                        总消息:
                        <span class="stat-value" id="totalCount">0</span>
                    </div>
                </div>
            </div>
        </div>

        <script>
            let ws = null;
            let sentCount = 0;
            let recvCount = 0;

            function getTime() {
                const now = new Date();
                return (
                    now.toLocaleTimeString("zh-CN", { hour12: false }) +
                    "." +
                    String(now.getMilliseconds()).padStart(3, "0")
                );
            }

            function log(type, message) {
                const logContainer = document.getElementById("log");
                const entry = document.createElement("div");
                entry.className = "log-entry";

                let className = "log-system";
                let prefix = "ℹ️";

                switch (type) {
                    case "sent":
                        className = "log-sent";
                        prefix = "⬆️";
                        sentCount++;
                        document.getElementById("sentCount").textContent =
                            sentCount;
                        break;
                    case "received":
                        className = "log-received";
                        prefix = "⬇️";
                        recvCount++;
                        document.getElementById("recvCount").textContent =
                            recvCount;
                        break;
                    case "error":
                        className = "log-error";
                        prefix = "❌";
                        break;
                    case "close":
                        className = "log-close";
                        prefix = "🔒";
                        break;
                }

                document.getElementById("totalCount").textContent =
                    sentCount + recvCount;

                entry.innerHTML = `<span class="log-time">[${getTime()}]</span> <span class="${className}">${prefix} ${message}</span>`;
                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            function updateStatus(status, text) {
                const statusEl = document.getElementById("status");
                const statusText = document.getElementById("statusText");

                statusEl.className = "status status-" + status;
                statusText.textContent = text;
            }

            function connect() {
                const url = document.getElementById("wsUrl").value.trim();
                if (!url) {
                    log("error", "请输入 WebSocket 地址");
                    return;
                }

                updateStatus("connecting", "连接中...");
                log("system", `正在连接 ${url}...`);

                try {
                    ws = new WebSocket(url);

                    ws.onopen = function () {
                        updateStatus("connected", "已连接");
                        log("system", "WebSocket 连接成功");
                        document.getElementById("btnConnect").disabled = true;
                        document.getElementById("btnDisconnect").disabled =
                            false;
                        document.getElementById("btnSend").disabled = false;
                        document.getElementById("wsUrl").disabled = true;
                    };

                    ws.onmessage = function (event) {
                        log("received", `收到: ${event.data}`);
                    };

                    ws.onerror = function (error) {
                        log("error", "连接错误: " + JSON.stringify(error));
                        updateStatus("disconnected", "错误");
                    };

                    ws.onclose = function (event) {
                        updateStatus("disconnected", "已断开");
                        log(
                            "close",
                            `连接关闭 (code: ${event.code}, reason: ${event.reason || "无"})`,
                        );
                        document.getElementById("btnConnect").disabled = false;
                        document.getElementById("btnDisconnect").disabled =
                            true;
                        document.getElementById("btnSend").disabled = true;
                        document.getElementById("wsUrl").disabled = false;
                        ws = null;
                    };
                } catch (e) {
                    log("error", "创建连接失败: " + e.message);
                    updateStatus("disconnected", "失败");
                }
            }

            function disconnect() {
                if (ws) {
                    ws.close(1000, "用户主动断开");
                }
            }

            function sendMessage() {
                const input = document.getElementById("messageInput");
                const message = input.value.trim();

                if (!message) {
                    log("error", "消息不能为空");
                    return;
                }

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(message);
                    log("sent", `发送: ${message}`);
                    input.value = "";
                    input.focus();
                } else {
                    log("error", "未连接，无法发送");
                }
            }

            function sendPing() {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    // 浏览器 WebSocket API 不暴露原生 ping/pong，
                    // 发送心跳文本消息作为替代
                    ws.send("__ping__");
                    log("sent", "发送: [心跳 Ping]");
                } else {
                    log("error", "未连接，无法发送 Ping");
                }
            }

            function clearLog() {
                document.getElementById("log").innerHTML = "";
                sentCount = 0;
                recvCount = 0;
                document.getElementById("sentCount").textContent = "0";
                document.getElementById("recvCount").textContent = "0";
                document.getElementById("totalCount").textContent = "0";
            }

            function handleKeyPress(event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            }

            // 页面加载时自动聚焦到输入框
            window.onload = function () {
                document.getElementById("wsUrl").focus();
            };
        </script>
    </body>
</html>
